<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxium - Portal Oficial</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 1.4rem;
      color: #0056b3;
      margin-top: 0;
    }
    .form-group {
      margin-top: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #0056b3;
    }
    .status {
      margin-top: 12px;
      font-weight: bold;
      min-height: 24px;
    }
    .status.sucesso { color: #28a745; }
    .status.erro { color: #dc3545; }
    
    footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <h1>Oi, aqui é o site de Luxium, ainda estamos construindo.</h1>
  <h2>seja um luxiano!</h2>

  <div class="form-group">
    <label for="nomeInput">digite aqui seu nome:</label>
    <input 
      type="text" 
      id="nomeInput" 
      placeholder="Digite seu nome e pressione Enter..." 
      autocomplete="off"
    />
  </div>

  <div id="statusMsg" class="status"></div>

  <footer>
    Total de pessoas que já são cidadãos: <strong id="totalCidadaos">0</strong>
  </footer>

  <script type="module">
    const input = document.getElementById('nomeInput');
    const statusMsg = document.getElementById('statusMsg');
    const totalElement = document.getElementById('totalCidadaos');

    // Função para buscar e atualizar a contagem de cidadãos
    async function carregarTotalCidadaos() {
      try {
        const res = await fetch('/actions/cidadaos/all.json');
        if (!res.ok) throw new Error();
        const cidadaos = await res.json();
        totalElement.textContent = Array.isArray(cidadaos) ? cidadaos.length : 0;
      } catch (err) {
        totalElement.textContent = 'Erro ao carregar';
      }
    }

    // Escuta o pressionamento de tecla no input
    input.addEventListener('keydown', async (event) => {
      if (event.key === 'Enter') {
        const nome = input.value.trim();

        if (!nome) {
          statusMsg.className = 'status erro';
          statusMsg.textContent = 'Por favor, digite um nome válido.';
          return;
        }

        try {
          statusMsg.className = 'status';
          statusMsg.textContent = 'Cadastrando...';

          const res = await fetch('/actions/cidadaos/all.json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            statusMsg.className = 'status sucesso';
            statusMsg.textContent = `Bem-vindo a Luxium, ${nome}!`;
            input.value = '';
            totalElement.textContent = data.total;
          } else {
            statusMsg.className = 'status erro';
            statusMsg.textContent = data.error || 'Erro ao realizar o cadastro.';
          }
        } catch (err) {
          statusMsg.className = 'status erro';
          statusMsg.textContent = 'Erro de conexão com o servidor.';
        }
      }
    });

    // Inicializa a contagem ao abrir a página
    carregarTotalCidadaos();
  </script>
</body>
</html>
